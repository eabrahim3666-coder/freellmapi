services:
  - type: web
    name: freellmapi
    runtime: image
    plan: free
    region: singapore
    healthCheckPath: /
    image:
      url: ghcr.io/tashfeenahmed/freellmapi:latest
    # ENCRYPTION_KEY is set once in the Render dashboard (Environment), not here:
    # Render's generateValue produces a non-hex string this app rejects.
